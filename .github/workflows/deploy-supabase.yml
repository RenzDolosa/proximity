name: Deploy Edge Functions

# Only fires on an actual merge to main, and only when Edge Function
# source changed — the AI review pipeline has already gated everything
# that got here.
#
# workflow_dispatch exists because the `paths:` filter creates a dead end that
# is otherwise unescapable: if a run fails for a reason OUTSIDE the function
# source (a missing secret, an under-scoped token, a bug in this workflow),
# fixing it changes no file under Supabase/functions/**, so no new run is ever
# triggered. Re-running the failed run does not help either — a re-run replays
# the workflow file as it was at the original commit, so it cannot pick up a
# fix to this file. Both of those happened during the 2026-10-05 rollout.
on:
  push:
    branches: [main]
    paths:
      - 'Supabase/functions/**'
  workflow_dispatch:
    inputs:
      function:
        description: 'Slug to deploy, or "all" for every function with committed source'
        required: false
        default: 'all'

jobs:
  # Free, fast, and catches real bugs (bad imports, type errors) before
  # ever touching the live project. Not a substitute for the canary gate
  # below — this only proves the code compiles, not that it behaves
  # correctly against real traffic.
  typecheck:
    name: Typecheck functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check every function
        run: |
          set -e
          for dir in Supabase/functions/*/; do
            entry="${dir}index.ts"
            if [ -f "$entry" ]; then
              echo "::group::deno check $entry"
              deno check --node-modules-dir=auto "$entry"
              echo "::endgroup::"
            fi
          done

  deploy:
    name: Deploy to Supabase
    needs: typecheck
    runs-on: ubuntu-latest
    # This is the actual "canary" checkpoint for this stack. Supabase Edge
    # Functions have no built-in traffic-split/percentage rollout the way
    # a load-balanced container service would — a deploy replaces the live
    # function outright. A GitHub Environment with required reviewers
    # (Settings > Environments > production > required reviewers) turns
    # this job into a manual gate: it stops right here and waits for an
    # approval click before touching the live project, so nothing ships
    # from an automatic merge without a human confirming first. See
    # .github/DEPLOYMENT.md for the setup step and the Supabase-Branching
    # alternative if you want this automated instead of manual.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to diff the push range below. The default shallow clone
          # (depth 1) has no parent commit to compare against, so every run
          # would fall back to deploying everything — which is exactly the
          # behaviour this is meant to replace.
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Works out WHICH functions this run should touch, and writes the list to
      # a file the deploy and smoke-test steps both read.
      #
      # Why this exists: the deploy step used to loop over every directory with
      # an index.ts regardless of what changed, so a one-line edit to one
      # function redeployed ALL of them — replacing live code that may have
      # been updated by hand outside this repo (Supabase/README.md records that
      # some functions were deployed that way). A deploy should only touch what
      # the commit actually changed.
      - name: Select functions to deploy
        env:
          # Interpolated through env, never directly into the script body:
          # workflow_dispatch inputs are attacker-controllable on a public repo
          # and `${{ }}` inside `run:` is textual substitution, i.e. shell
          # injection. Reading "$INPUT_FUNCTION" is safe; pasting it is not.
          INPUT_FUNCTION: ${{ inputs.function }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -e
          LIST="$RUNNER_TEMP/slugs.txt"
          : > "$LIST"

          # Every function that actually has source here. The others are
          # documentation-only stubs (see Supabase/README.md) and are deployed
          # by hand, so they must never be passed to the CLI.
          deployable() {
            for dir in Supabase/functions/*/; do
              [ -f "${dir}index.ts" ] && basename "$dir"
            done
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_FUNCTION" ] && [ "$INPUT_FUNCTION" != "all" ]; then
              if [ ! -f "Supabase/functions/$INPUT_FUNCTION/index.ts" ]; then
                echo "No committed source for function '$INPUT_FUNCTION'." >&2
                exit 1
              fi
              echo "$INPUT_FUNCTION" >> "$LIST"
            else
              deployable >> "$LIST"
            fi
          elif [ -z "$BEFORE_SHA" ] \
            || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            # First push to the branch, a force-push that orphaned the old tip,
            # or history the runner does not have. Deploying everything is the
            # safe fallback: under-deploying would silently leave a function
            # stale, which is harder to notice than an extra redeploy.
            echo "No usable base commit ($BEFORE_SHA) — deploying all functions with committed source."
            deployable >> "$LIST"
          else
            # Slug is the third path segment: Supabase/functions/<slug>/...
            # A deleted directory can appear here, hence the index.ts guard.
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'Supabase/functions/**' \
              | cut -d/ -f3 | sort -u \
              | while read -r slug; do
                  [ -n "$slug" ] || continue
                  if [ -f "Supabase/functions/$slug/index.ts" ]; then
                    echo "$slug"
                  else
                    echo "Skipping $slug — changed but has no committed index.ts." >&2
                  fi
                done >> "$LIST"
          fi

          if [ ! -s "$LIST" ]; then
            echo "No functions to deploy."
          else
            echo "Will deploy:"; sed 's/^/  /' "$LIST"
          fi

      - name: Deploy selected functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          # The Supabase CLI resolves a function's source from a LOWERCASE
          # `supabase/functions/<slug>/index.ts`, and that location is not
          # configurable — `functions deploy` takes a slug, not a path. This
          # repo capitalises the directory (`Supabase/`) to match JS/, CSS/
          # and Public/, which is invisible on the case-insensitive
          # filesystems used for development and fatal on the case-sensitive
          # Linux runner:
          #   entrypoint path does not exist (.../supabase/functions/<slug>/index.ts)
          # A symlink gives the CLI the spelling it insists on without
          # renaming a directory that this repo's docs, scripts and workflows
          # reference by name in dozens of places. The guard also makes this a
          # no-op on a case-insensitive filesystem, where `-e supabase`
          # already matches `Supabase`.
          [ -e supabase ] || ln -s Supabase supabase

          LIST="$RUNNER_TEMP/slugs.txt"
          if [ ! -s "$LIST" ]; then
            echo "Nothing selected for deploy — see the previous step."
            exit 0
          fi
          while read -r slug; do
            [ -n "$slug" ] || continue
            echo "::group::deploy $slug"
            supabase functions deploy "$slug" \
              --project-ref "$PROJECT_REF" \
              --no-verify-jwt=false
            echo "::endgroup::"
          done < "$LIST"

      - name: Smoke test
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          # Confirms each function this run actually deployed is reachable and
          # responding (a 401/CORS-preflight-style response is expected and
          # fine here — this only proves the function didn't fail to boot, not
          # that its full logic is correct). Scoped to the deployed list rather
          # than every function, so a green smoke test means "what I just
          # shipped is up", not "something is up somewhere".
          LIST="$RUNNER_TEMP/slugs.txt"
          if [ ! -s "$LIST" ]; then
            echo "Nothing deployed — nothing to smoke test."
            exit 0
          fi
          while read -r slug; do
            [ -n "$slug" ] || continue
            url="https://${PROJECT_REF}.supabase.co/functions/v1/${slug}"
            code="$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$url")"
            echo "$slug: OPTIONS -> $code"
            if [ "$code" -ge 500 ]; then
              echo "::error::$slug returned $code on a basic OPTIONS request post-deploy"
              exit 1
            fi
          done < "$LIST"
