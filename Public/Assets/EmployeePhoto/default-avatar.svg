<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No photo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Bundled generic silhouette shown when an employee HAS a photo on
       file but it can't be loaded right now (offline, never cached, a
       transient error) — not used when there's simply no photo at all,
       see Utils/format.js's avatarHTML(). Colors are hardcoded (not
       currentColor/CSS vars) because this is loaded via <img src="...">
       into an isolated document context that can't inherit the host
       page's styles; see ProximityLogo.js's comment on the same issue
       for the brand mark, which is why that one is inlined instead. This
       one stays a plain static file (like the bundled scan sounds) since
       it only needs to look right on the app's one dark theme, not be
       recolored per-context. -->
  <rect width="100" height="100" fill="#171D26"/>
  <circle cx="50" cy="40" r="18" fill="#5C6472"/>
  <path d="M50 63c-23 0-41 15.5-41 35.5V100h82v-1.5C91 78.5 73 63 50 63z" fill="#5C6472"/>
</svg>
