<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Proximity">
  <!-- Installed-app icon. Maskable, so everything meaningful stays inside the
       safe zone (the centre 80%) — Android crops this to a circle, squircle or
       rounded square depending on the launcher. -->
  <rect width="512" height="512" rx="104" fill="#0B0F17"/>
  <g fill="none" stroke="#4F8EF7" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" stroke-width="12" opacity=".25"/>
    <path d="M170 196a120 120 0 0 1 172 0" stroke-width="20"/>
    <path d="M196 232a84 84 0 0 1 120 0" stroke-width="20" opacity=".8"/>
    <path d="M222 268a48 48 0 0 1 68 0" stroke-width="20" opacity=".6"/>
  </g>
  <rect x="196" y="300" width="120" height="78" rx="14" fill="#E8EDF5"/>
  <circle cx="256" cy="339" r="17" fill="#0B0F17"/>
</svg>
