<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proximity — ID &amp; Access Console</title>
<!-- Applies a saved light-mode preference (JS/Utils/theme.js) before the
     stylesheet below is even requested, so a returning user who chose
     light mode never sees a one-frame flash of dark first. Deliberately
     a plain, non-module, synchronous script — JS/main.js and everything
     it imports is type="module", which defers until after the HTML is
     parsed and the browser may have already started painting; by then
     it would be too late to avoid the flash. Kept to these exact two
     lines (read localStorage, set the attribute) in sync with
     JS/Utils/theme.js's getTheme()/setTheme() by convention — see that
     file's header comment for why it can't just import this instead. -->
<script>
(function(){try{if(localStorage.getItem('proximity-theme')==='light')document.documentElement.dataset.theme='light';}catch(e){}})();
</script>
<link rel="icon" type="image/svg+xml" href="Assets/Favicon/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../CSS/main.css" />
</head>
<body>
<div id="app">
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-mark"><div class="dot"></div><span>Proximity</span></div>
      <div id="login-form">
        <h1>Sign in</h1>
        <p class="sub">Access the ID &amp; proximity console.</p>
        <div class="field"><label>Email</label><input id="login-email" type="email" placeholder="you@company.com" /></div>
        <div class="field"><label>Password</label><input id="login-password" type="password" placeholder="••••••••" /></div>
        <button class="primary" id="login-submit" style="width:100%">Sign in</button>
        <div class="auth-error hidden" id="login-error"></div>
      </div>
      <div class="auth-note">Permission tiers: <strong style="color:var(--text-muted)">admin</strong> (full control incl. user roles), <strong style="color:var(--text-muted)">manager</strong> (edit directory &amp; cards), <strong style="color:var(--text-muted)">viewer</strong> (read + scan). New accounts are created by an admin under Users &amp; Roles — there's no self-service sign-up.</div>
    </div>
  </div>

  <div id="standalone-scanner" class="hidden standalone-scan"></div>

  <div id="shell" class="hidden">
    <aside id="sidebar">
      <div class="brand"><div class="dot"></div><span>Proximity</span></div>
      <nav class="rail">
        <button data-route="directory" class="active"><span class="ic">▤</span>Employee Manager</button>
        <button data-route="proximity"><span class="ic">◈</span>Proximity Cards</button>
        <button data-route="scanner"><span class="ic">▣</span>Test Scan</button>
        <button data-route="users" id="nav-users" class="hidden"><span class="ic">☺</span>Users &amp; Roles</button>
      </nav>
      <div class="rail-spacer"></div>
      <nav class="rail rail-bottom">
        <button data-route="settings" id="nav-settings" class="hidden"><span class="ic">⚙</span>Settings</button>
      </nav>
    </aside>
    <div id="main">
      <div id="topbar">
        <div class="topbar-title">
          <h2 id="page-title">Employee Manager</h2>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="who">
          <div class="who-text">
            <div class="name" id="who-name">—</div>
            <div class="role" id="who-role">—</div>
          </div>
          <button class="ghost" id="btn-signout">Sign out</button>
        </div>
      </div>
      <div id="content"></div>
    </div>
  </div>
</div>

<!-- Vendored Supabase SDK (see Vendor/README.md) — exposes window.supabase -->
<script src="Vendor/supabase-js.umd.js"></script>
<!-- Vendored SheetJS mini build (see Vendor/README.md) — exposes window.XLSX,
     used by JS/Utils/xlsxExport.js for every "Export .xlsx" button -->
<script src="Vendor/xlsx.mini.min.js"></script>
<!-- App code — native ES modules, entry point at JS/main.js -->
<script type="module" src="../JS/main.js"></script>
</body>
</html>
